<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoudLabs | QR Code</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #161a20;
    --line: #242a33;
    --text: #e8edf3;
    --muted: #8a94a3;
    --accent: #2ee6e6;
    --accent-2: #14b8c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(46,230,230,.12), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(20,184,201,.10), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 20px 28px;
    border-bottom: 1px solid var(--line);
  }
  header img { width: 44px; height: 44px; border-radius: 10px; }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .brand span { color: var(--accent); }
  header .tag { margin-inline-start: auto; font-size: 13px; color: var(--muted); }

  main {
    flex: 1; width: min(94vw, 980px); margin: 32px auto; display: grid;
    grid-template-columns: 1fr 340px; gap: 24px; align-items: start;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .section { margin-bottom: 22px; }
  .section h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }

  input[type=url] {
    width: 100%; padding: 13px 14px; border-radius: 12px; font-size: 15px;
    background: #0f1217; color: var(--text); border: 1px solid var(--line); outline: none;
  }
  input[type=url]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,230,230,.15); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .color {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: #0f1217; border: 1px solid var(--line); font-size: 14px; color: var(--muted);
  }
  .color input { width: 34px; height: 34px; border: 0; background: none; padding: 0; cursor: pointer; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
    background: #0f1217; color: var(--muted); border: 1px solid var(--line);
    transition: .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.on { color: #04201f; background: var(--accent); border-color: var(--accent); font-weight: 600; }

  .preview {
    position: sticky; top: 20px; text-align: center;
  }
  .qr-wrap {
    background: #fff; border-radius: 16px; padding: 18px; display: inline-block;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  #qr { width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
  #qr canvas, #qr svg, #qr img { width: 260px !important; height: 260px !important; max-width: 100%; display: block; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .btn {
    padding: 13px; border-radius: 12px; border: 0; cursor: pointer; font-size: 15px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #04201f;
  }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(1.05); }

  footer {
    text-align: center; padding: 18px; font-size: 13px; color: var(--muted);
    border-top: 1px solid var(--line);
  }
  footer b { color: var(--text); }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .preview { position: static; order: -1; }
    header .tag { display: none; }
  }
</style>
</head>

const $ = id => document.getElementById(id);

let dotType = "rounded";
let cornerType = "extra-rounded";
let current = null;

// الشعار: نحمّله أولاً، وإذا وصل نعيد الرسم
const logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; render(); };
logoImg.src = LOGO;

const Q = 4; // المنطقة الهادئة حول الكود (بالموديولات)

function buildMatrix(text) {
  const qr = new QRCodeLib(-1, QRErrorLevels.H);
  qr.addData(unescape(encodeURIComponent(text)));
  qr.make();
  const n = qr.getModuleCount();
  const m = [];
  for (let r = 0; r < n; r++) {
    m.push([]);
    for (let c = 0; c < n; c++) m[r].push(qr.isDark(r, c));
  }
  return m;
}

// يحسب كل الأشكال بوحدة "موديول"، فيُستخدم نفس الحساب للـ Canvas والـ SVG
function layout(text, dark, bg) {
  const M = buildMatrix(text);
  const n = M.length;
  const N = n + 2 * Q;
  const prims = [];

  const finder = (fx, fy) => {
    const X = fx + Q, Y = fy + Q;
    if (cornerType === "dot") {
      prims.push({ t: "circle", cx: X + 3.5, cy: Y + 3.5, r: 3.5, fill: dark });
      prims.push({ t: "circle", cx: X + 3.5, cy: Y + 3.5, r: 2.5, fill: bg });
      prims.push({ t: "circle", cx: X + 3.5, cy: Y + 3.5, r: 1.5, fill: dark });
      return;
    }
    const sq = cornerType === "square";
    const ro = sq ? 0 : 2.2, ri = sq ? 0 : 1.3, rc = sq ? 0 : 0.9;
    prims.push({ t: "rect", x: X, y: Y, w: 7, h: 7, r: ro, fill: dark });
    prims.push({ t: "rect", x: X + 1, y: Y + 1, w: 5, h: 5, r: ri, fill: bg });
    prims.push({ t: "rect", x: X + 2, y: Y + 2, w: 3, h: 3, r: rc, fill: dark });
  };
  finder(0, 0);
  finder(n - 7, 0);
  finder(0, n - 7);

  const dot = (X, Y) => {
    switch (dotType) {
      case "square":
        return { t: "rect", x: X, y: Y, w: 1, h: 1, r: 0, fill: dark };
      case "dots":
        return { t: "circle", cx: X + 0.5, cy: Y + 0.5, r: 0.46, fill: dark };
      case "extra-rounded":
        return { t: "rect", x: X + 0.04, y: Y + 0.04, w: 0.92, h: 0.92, r: 0.46, fill: dark };
      case "classy":
        return { t: "rect", x: X + 0.04, y: Y + 0.04, w: 0.92, h: 0.92, r: 0.12, fill: dark };
      case "classy-rounded":
        return { t: "rect", x: X + 0.04, y: Y + 0.04, w: 0.92, h: 0.92, r: 0.28, fill: dark };
      default: // rounded
        return { t: "rect", x: X + 0.04, y: Y + 0.04, w: 0.92, h: 0.92, r: 0.32, fill: dark };
    }
  };

  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (!M[r][c]) continue;
      const inFinder = (r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8);
      if (inFinder) continue;
      prims.push(dot(c + Q, r + Q));
    }
  }

  // الشعار في المنتصف على خلفية بيضاء صغيرة
  const L = Math.round(n * 0.24);
  const lx = (N - L) / 2, ly = (N - L) / 2;
  const pad = 1;
  prims.push({ t: "rect", x: lx - pad, y: ly - pad, w: L + 2 * pad, h: L + 2 * pad, r: 1.2, fill: "#ffffff" });

  return { N, prims, logo: { x: lx, y: ly, size: L }, bg };
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCanvas(ctx, L, px, withLogo) {
  const k = px / L.N;
  ctx.fillStyle = L.bg;
  ctx.fillRect(0, 0, px, px);
  for (const p of L.prims) {
    ctx.fillStyle = p.fill;
    if (p.t === "rect") {
      roundRectPath(ctx, p.x * k, p.y * k, p.w * k, p.h * k, p.r * k);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.cx * k, p.cy * k, p.r * k, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (withLogo && logoReady) {
    const g = L.logo;
    ctx.drawImage(logoImg, g.x * k, g.y * k, g.size * k, g.size * k);
  }
}

function toSVG(L) {
  const parts = [];
  for (const p of L.prims) {
    if (p.t === "rect") {
      parts.push(`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.r}" fill="${p.fill}"/>`);
    } else {
      parts.push(`<circle cx="${p.cx}" cy="${p.cy}" r="${p.r}" fill="${p.fill}"/>`);
    }
  }
  const g = L.logo;
  parts.push(`<image href="${LOGO}" x="${g.x}" y="${g.y}" width="${g.size}" height="${g.size}"/>`);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${L.N} ${L.N}" width="1024" height="1024">` +
         `<rect width="${L.N}" height="${L.N}" fill="${L.bg}"/>` + parts.join("") + `</svg>`;
}

function getInput() {
  return {
    text: $("url").value.trim() || "https://joudlabs.com",
    dark: $("dotColor").value,
    bg: $("bgColor").value
  };
}

function render() {
  const i = getInput();
  current = layout(i.text, i.dark, i.bg);
  const dpr = window.devicePixelRatio || 1;
  const px = Math.round(260 * dpr);
  const cv = document.createElement("canvas");
  cv.width = px;
  cv.height = px;
  cv.style.width = "260px";
  cv.style.height = "260px";
  drawCanvas(cv.getContext("2d"), current, px, true);
  const box = $("qr");
  box.innerHTML = "";
  box.appendChild(cv);
}

function bindChips(id, setter) {
  document.querySelectorAll(`#${id} .chip`).forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(`#${id} .chip`).forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      setter(btn.dataset.v);
      render();
    });
  });
}
bindChips("dotChips", v => dotType = v);
bindChips("cornerChips", v => cornerType = v);
["url", "dotColor", "bgColor"].forEach(id => $(id).addEventListener("input", render));

function download(ext) {
  const i = getInput();
  const L = layout(i.text, i.dark, i.bg);
  let href, name = "joudlabs-qr." + ext;
  if (ext === "png") {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 1024;
    drawCanvas(cv.getContext("2d"), L, 1024, true);
    href = cv.toDataURL("image/png");
  } else {
    href = URL.createObjectURL(new Blob([toSVG(L)], { type: "image/svg+xml" }));
  }
  const a = document.createElement("a");
  a.href = href;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

render();

  const $ = id => document.getElementById(id);
  let dotType = "rounded", cornerType = "extra-rounded";
  let qr = null;

  function makeOptions() {
    const url = $("url").value.trim() || "https://joudlabs.com";
    const color = $("dotColor").value;
    return {
      width: 260, height: 260, data: url, margin: 4,
      qrOptions: { errorCorrectionLevel: "H" },
      image: LOGO,
      imageOptions: { crossOrigin: "anonymous", margin: 6, imageSize: 0.3, hideBackgroundDots: true },
      dotsOptions: { color, type: dotType },
      cornersSquareOptions: { type: cornerType, color },
      cornersDotOptions: { type: cornerType === "dot" ? "dot" : "square", color },
      backgroundOptions: { color: $("bgColor").value }
    };
  }

  // نعيد بناء الكيو آر كود من الصفر في كل تغيير، لأن qr.update غير موثوق مع الشعار
  function render(withLogo = true) {
    const box = $("qr");
    box.innerHTML = "";
    try {
      const opts = makeOptions();
      if (!withLogo) delete opts.image;
      qr = new QRCodeStyling(opts);
      qr.append(box);
      // إذا ما انرسم شي (مشكلة مع الشعار)، نعيد الرسم بدونه
      setTimeout(() => {
        if (withLogo && box.childElementCount === 0) render(false);
      }, 800);
    } catch (e) {
      console.error("QR render failed:", e);
      if (withLogo) render(false);
    }
  }

  function bindChips(id, setter) {
    document.querySelectorAll(`#${id} .chip`).forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(`#${id} .chip`).forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        setter(btn.dataset.v);
        render();
      });
    });
  }
  bindChips("dotChips", v => dotType = v);
  bindChips("cornerChips", v => cornerType = v);

  ["url", "dotColor", "bgColor"].forEach(id => $(id).addEventListener("input", render));

  function download(ext) {
    if (qr) qr.download({ name: "joudlabs-qr", extension: ext });
  }

  render();
